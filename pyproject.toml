[project]
name = "automatic-interviews-processing"
version = "2.0.0"
description = "Transcription with speaker diarization for audio interviews, plus evaluation and text/topic analysis."
authors = [
    {name = "AfroDeivid",email = "92383275+AfroDeivid@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wget>=3.2,<4",
    "nemo-toolkit[asr]>=2.3.0,<3",
    "nltk>=3.9.1,<4",
    "faster-whisper>=1.1.0",
    "demucs",
    "deepmultilingualpunctuation",
    "ctc-forced-aligner",
    "ipykernel>=6.29.5,<7",
    "pandas>=2.2.3,<3",
    "pydub>=0.25.1,<0.26",
    "numpy<2",
    "indic-numtowords",
    "psutil>=7.0.0,<8",
    "soundfile",
]

[project.optional-dependencies]
# Evaluation, text analysis and topic modelling notebooks (notebooks/)
analysis = [
    "matplotlib",
    "seaborn",
    "plotly",
    "wordcloud",
    "networkx",
    "beautifulsoup4",
    "spacy",
    "en-core-web-sm",
    "bertopic",
    "nbformat",
    "streamlit",
]

[project.scripts]
interviews-transcribe = "interviews_processing.run_diarize:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# onnx (via nemo-toolkit) uses ml_dtypes.float4_e2m1fn but does not declare the minimum version
constraint-dependencies = ["ml-dtypes>=0.5.0"]

[tool.uv.sources]
demucs = { git = "https://github.com/MahmoudAshraf97/demucs.git", rev = "4273070a70ded308ddfd0879d267bbd06f89a1b7" }
deepmultilingualpunctuation = { git = "https://github.com/oliverguhr/deepmultilingualpunctuation.git", rev = "5a0dd7f4fd56687f59405aa8eba1144393d8b74b" }
ctc-forced-aligner = { git = "https://github.com/MahmoudAshraf97/ctc-forced-aligner.git", rev = "11855d1de76af2b490dd2e8e2db2661805ae90a0" }
indic-numtowords = { git = "https://github.com/AI4Bharat/indic-numtowords.git", rev = "167927b24ba9c843a1c62021d47fcbe71f6f177f" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interviews_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end run that downloads and runs the real models"]
addopts = "-m 'not slow'"
